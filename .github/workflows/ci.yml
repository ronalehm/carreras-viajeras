name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tests, types and Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run --maxWorkers=3
      - name: Generate route types
        run: ./node_modules/.bin/next typegen
      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit
      - name: Build Next.js and package the Worker
        run: npm run build:worker
      - name: Check packaged environment
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const output = readFileSync('.open-next/cloudflare/next-env.mjs', 'utf8');
          if (/\b(?:DATABASE_URL|CLERK_SECRET_KEY|N8N_API_TOKEN|TURNSTILE_SECRET_KEY)\b/.test(output)) {
            throw new Error('Non-public runtime variables found in the Worker environment module');
          }
          NODE
